[project]
name = "boardgames-trainer"
version = "0.1.0"
description = "Board-game RL consumer for modeltrainer — the §C rigorous-evaluation driving case."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: deep exact solves (e.g. solving from the opening) — excluded by `-m 'not slow'`",
]
